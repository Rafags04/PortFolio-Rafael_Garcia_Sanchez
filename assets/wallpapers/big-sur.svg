<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bsSky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#191645"/>
      <stop offset="32%" stop-color="#5d2666"/>
      <stop offset="62%" stop-color="#c83e63"/>
      <stop offset="86%" stop-color="#f28452"/>
      <stop offset="100%" stop-color="#fcc97b"/>
    </linearGradient>
    <radialGradient id="bsSunGlow" cx="0.52" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#ffe19c" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#f76b56" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5d2666" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bsRidge1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3168"/>
      <stop offset="50%" stop-color="#9e3963"/>
      <stop offset="100%" stop-color="#4e2458"/>
    </linearGradient>
    <linearGradient id="bsRidge2" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#3c265e"/>
      <stop offset="48%" stop-color="#5a3269"/>
      <stop offset="100%" stop-color="#21224a"/>
    </linearGradient>
    <linearGradient id="bsRidge3" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="52%" stop-color="#284c70"/>
      <stop offset="100%" stop-color="#111d38"/>
    </linearGradient>
    <linearGradient id="bsRidge4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b162d"/>
      <stop offset="55%" stop-color="#132b4d"/>
      <stop offset="100%" stop-color="#070e1f"/>
    </linearGradient>
    <linearGradient id="bsMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb88c" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ff8e72" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a1f3d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#bsSky)"/>
  <rect width="1920" height="1200" fill="url(#bsSunGlow)"/>

  <!-- Distant coastal ridge -->
  <path d="M-40 610 C 260 470, 520 510, 790 430 C 1060 350, 1290 440, 1540 390 C 1710 355, 1840 410, 1960 460 L 1960 1240 L -40 1240 Z" fill="url(#bsRidge1)"/>
  <!-- Warm mist veil -->
  <rect y="480" width="1920" height="240" fill="url(#bsMist)"/>
  <!-- Second sculpted ridge -->
  <path d="M-40 720 C 220 595, 480 680, 760 580 C 1020 485, 1280 565, 1590 505 C 1760 470, 1880 520, 1960 555 L 1960 1240 L -40 1240 Z" fill="url(#bsRidge2)" opacity="0.96"/>
  <!-- Deep Pacific headland -->
  <path d="M-40 835 C 310 735, 590 830, 920 710 C 1190 610, 1480 730, 1960 645 L 1960 1240 L -40 1240 Z" fill="url(#bsRidge3)"/>
  <!-- Foreground silhouette ridge -->
  <path d="M-40 960 C 260 905, 540 975, 860 885 C 1180 795, 1520 910, 1960 820 L 1960 1240 L -40 1240 Z" fill="url(#bsRidge4)"/>
